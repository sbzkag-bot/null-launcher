name: Build Modern Null Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Java 17
      uses: actions/setup-java@v4.4.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build modern map for sky robot
      run: |
        cat << 'EOF' > settings.gradle
        rootProject.name = "NullLauncher"
        include ':app'
        EOF

        mkdir -p app/src/main
        if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
        if [ -d res ]; then mv res app/src/main/; fi
        if [ -d src ]; then mv src app/src/main/; fi

        # Scrape old name tag off manifest file
        sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.notriddle.null_launcer'
            compileSdk 34

            defaultConfig {
                applicationId "com.notriddle.null_launcer"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

    - name: Bake 64-bit APK
      run: gradle assembleDebug

    - name: Save finished APK
      uses: actions/upload-artifact@v4.4.3
      with:
        name: NullLauncher-Modern
        path: "app/build/outputs/apk/debug/*.apk"
      
