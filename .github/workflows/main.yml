name: Build Modern Null Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Java 17
      uses: actions/setup-java@v4.4.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Build modern map for sky robot
      run: |
        cat << 'EOF' > settings.gradle
        rootProject.name = "NullLauncher"

        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
            }
        }

        include ':app'
        EOF

        mkdir -p app/src/main
        if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
        if [ -d res ]; then mv res app/src/main/; fi
        if [ -d src ]; then mv src app/src/main/; fi

        # Scrape old name tag off manifest file
        sed -i 's/package="[^"]*"
