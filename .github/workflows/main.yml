name: Build Modern Null Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Generate rock-solid launcher code
      run: |
        rm -rf app src res AndroidManifest.xml
        mkdir -p app/src/main/java/com/notriddle/nulllauncher

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m
        org.gradle.caching=true
        org.gradle.parallel=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "NullLauncher"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }

        android {
            namespace 'com.notriddle.nulllauncher'
            compileSdk 34

            defaultConfig {
                applicationId "com.notriddle.nulllauncher"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.EXPAND_STATUS_BAR" />

            <queries>
                <package android:name="ginlemon.smartdrawer" />
                <package android:name="com.tiendnm.zukulock" />
            </queries>

            <application
                android:label="Null Launcher"
                android:hasCode="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:theme="@android:style/Theme.Wallpaper.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleInstance"
                    android:excludeFromRecents="true"
                    android:stateNotNeeded="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.HOME" />
                        <category android:name="android.intent.category.DEFAULT" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/notriddle/nulllauncher/MainActivity.java
        package com.notriddle.nulllauncher;

        import android.app.Activity;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.graphics.Color;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.GestureDetector;
        import android.view.MotionEvent;
        import android.view.View;
        import android.view.Window;
        import android.view.WindowManager;
        import java.lang.reflect.Method;

        public class MainActivity extends Activity {
            private GestureDetector gestureDetector;
            private PackageManager packageManager;
            private Object statusBarService;
            private Method expandNotificationMethod;
            
            private static final String SWIPE_UP_PACKAGE = "ginlemon.smartdrawer";
            private static final String DOUBLE_TAP_PACKAGE = "com.tiendnm.zukulock";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                packageManager = getPackageManager();

                try {
                    statusBarService = getSystemService("statusbar");
                    Class<?> statusBarManager = Class.forName("android.app.StatusBarManager");
                    expandNotificationMethod = statusBarManager.getMethod("expandNotificationsPanel");
                } catch (Exception ignored) {}

                Window w = getWindow();
                w.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                w.setStatusBarColor(Color.TRANSPARENT);
                w.setNavigationBarColor(Color.TRANSPARENT);

                w.getDecorView().setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                    View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                    View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                );

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                    w.getAttributes().layoutInDisplayCutoutMode =
                        WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                }

                gestureDetector = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                    private static final int THRESHOLD = 80;

                    @Override
                    public boolean onDown(MotionEvent e) {
                        return true;
                    }

                    @Override
                    public boolean onFling(MotionEvent e1, MotionEvent e2, float velocityX, float velocityY) {
                        if (e1 == null || e2 == null) return false;
                        float diffY = e2.getY() - e1.getY();
                        float diffX = e2.getX() - e1.getX();

                        if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > THRESHOLD && Math.abs(velocityY) > THRESHOLD) {
                            if (diffY > 0) {
                                expandNotifications();
                            } else {
                                openApp(SWIPE_UP_PACKAGE);
                            }
                            return true;
                        }
                        return false;
                    }

                    @Override
                    public boolean onDoubleTap(MotionEvent e) {
                        openApp(DOUBLE_TAP_PACKAGE);
                        return true;
                    }
                });

                View emptyView = new View(this) {
                    @Override
                    public boolean performClick() {
                        return super.performClick();
                    }
                };
                emptyView.setClickable(true);
                emptyView.setFocusable(true);
                emptyView.setOnTouchListener((v, event) -> {
                    boolean handled = gestureDetector.onTouchEvent(event);
                    if (!handled && event.getAction() == MotionEvent.ACTION_UP) {
                        v.performClick();
                    }
                    return handled;
                });
                setContentView(emptyView);
            }

            @Override
            public void onBackPressed() {}

            private void expandNotifications() {
                try {
                    if (expandNotificationMethod != null && statusBarService != null) {
                        expandNotificationMethod.invoke(statusBarService);
                    }
                } catch (Exception ignored) {}
            }

            private void openApp(String packageName) {
                try {
                    Intent intent = packageManager.getLaunchIntentForPackage(packageName);
                    if (intent != null) {
                        intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                        startActivity(intent);
                    }
                } catch (Exception ignored) {}
            }
        }
        EOF

    - name: Set up Java 17
      uses: actions/setup-java@v4.4.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Bake secure APK
      run: gradle assembleDebug --build-cache --parallel

    - name: Save finished APK
      uses: actions/upload-artifact@v4.4.3
      with:
        name: NullLauncher-Modern
        path: "app/build/outputs/apk/debug/*.apk"
